<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ixigo Hotels</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="logo">
            <img src="ixigo.png" alt="Ixigo">
        </div>

        <ul id="q1">
            <li><a href="#">Hotels</a></li>
            <li><a href="#">Hotels Near Me</a></li>
            <li><a href="#">Find</a></li>
            <li><a href="#">Login</a></li>
        </ul>
    </header>

    <main>

        <img src="nature.jpg" alt="Nature">

        <div class="hero-content">

            <h1>ixigo</h1>

            <input
                id="city"
                type="text"
                placeholder="Search the city!"
            >

            <div class="search-options">

                <button class="btn">Search</button>

                <select id="guest">
                    <option selected disabled>Guests</option>
                    <option>1 Guest</option>
                    <option>2 Guests</option>
                    <option>3 Guests</option>
                    <option>4 Guests</option>
                    <option>5 Guests</option>
                </select>

                <select id="room">
                    <option selected disabled>Rooms</option>
                    <option>1 Room</option>
                    <option>2 Rooms</option>
                    <option>3 Rooms</option>
                    <option>4 Rooms</option>
                </select>

                <button class="btn">Search</button>

            </div>

            <input id="ib" type="date">

        </div>

    </main>

    <section class="popular">

        <h2>Popular Destinations</h2>

        <div class="cards">

            <div class="card">
                <img src="mumbai.jpg" alt="">
                <h3>Mumbai</h3>
                <p>From ₹10000/night</p>
            </div>

            <div class="card">
                <img src="nagpur.jpg" alt="">
                <h3>Nagpur</h3>
                <p>From ₹7500/night</p>
            </div>

            <div class="card">
                <img src="pune.jpg" alt="">
                <h3>Pune</h3>
                <p>From ₹9000/night</p>
            </div>

            <div class="card">
                <img src="amravati.jpg" alt="">
                <h3>Amravati</h3>
                <p>From ₹5000/night</p>
            </div>

        </div>

    </section>

    <footer>

        <p>Copyright &copy; 2026 | All Rights Reserved</p>
        <p>Help</p>
        <p>FAQ</p>
        <p>Destinations</p>

    </footer>
<script src="hotel.js"></script>
</body>
</html>
