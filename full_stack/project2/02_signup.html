<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>

    <link rel="stylesheet" href="02_signup.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<div class="container">

    <div class="logo">
        🚀
    </div>

    <h1>Create Your Account</h1>

    <p class="sub-title">
        enjoy fast and safe booking exprience
    </p>

    <form>

        <label>Full Name</label>

        <div class="input-box">
            <i class="fa-regular fa-user"></i>
            <input type="text" placeholder="Rahul Sharma">
        </div>

        <label>Email Address</label>

        <div class="input-box">
            <i class="fa-regular fa-envelope"></i>
            <input type="email" placeholder="you@example.com">
        </div>

       

        <label>Password</label>

        <div class="input-box">
            <i class="fa-solid fa-lock"></i>
            <input type="password" placeholder="Min. 6 characters">
            <i class="fa-regular fa-eye eye"></i>
        </div>

        <label>Confirm Password</label>

        <div class="input-box">
            <i class="fa-solid fa-lock"></i>
            <input type="password" placeholder="Re-enter password">
        </div>

        <button>Create Account</button>

    </form>

    <p class="login">
        Already have an accounts?
        <a href="01_login_page.html">Login here</a>
    </p>

</div>
<script src="02_signup.js"></script>
</body>
</html>
