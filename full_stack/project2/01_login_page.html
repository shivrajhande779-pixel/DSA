<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="01_login_page.css">
</head>
<body>

<div class="container">

    <div class="logo">
       <i class="fa-solid fa-hotel"></i>
    </div>

    <h1>Welcome Back!</h1>
    <p class="subtitle">Login to continue your learning journey</p>

    <form>

        <label>Email Address</label>

        <div class="input-box">
            <i class="fa-regular fa-envelope"></i>
            <input type="email" placeholder="shivrajhande@gmail.com">
        </div>

        <label>Password</label>

        <div class="input-box">
            <i class="fa-solid fa-lock"></i>
            <input type="password" placeholder="******">
            <i class="fa-regular fa-eye eye"></i>
        </div>

        <button type="submit">Login</button>

    </form>

    <div class="divider">
        <span></span>
        <p>or</p>
        <span></span>
    </div>

    <p class="signup">
        New to agoda?
        <a href="02_signup.html">Create a free account</a>
    </p>

    <div class="demo">
        <h4>🔑 Demo Credentials</h4>

        <p>Admin: admin@nexlearn.com / admin123</p>
        <p>Teacher: teacher@nexlearn.com / teacher123</p>
        <p>Student: student@nexlearn.com / student123</p>
    </div>

</div>

</body>
</html>
