<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px;
            background: linear-gradient(to right, #74ebd5, #9face6);
        }

        .container {
            background: white;
            width: 400px;
            margin: auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        input {
            width: 80%;
            padding: 10px;
            margin: 10px 0;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #4CAF50;
            color: white;
        }

        button:hover {
            background-color: #45a049;
        }

        #output {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
        }

        #clock {
            margin-top: 15px;
            font-size: 22px;
            color: darkblue;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>DOM & BOM Demo Page</h2>

        <input type="text" id="nameInput" placeholder="Enter your name">

        <br>

        <button onclick="showGreeting()">Show Greeting</button>
        <button onclick="changeColor()">Change Color</button>
        <button onclick="showBrowserInfo()">Browser Info</button>

        <div id="output"></div>

        <h3>Live Clock</h3>
        <div id="clock"></div>
    </div>

    <script>
        // DOM Manipulation - Greeting
        function showGreeting() {
            let name = document.getElementById("nameInput").value;

            if (name === "") {
                document.getElementById("output").innerHTML =
                    "Please enter your name!";
            } else {
                document.getElementById("output").innerHTML =
                    "Welcome, " + name + " 🎉";
            }
        }

        // DOM Manipulation - Change Background Color
        function changeColor() {
            let colors = [
                "#FFD700",
                "#90EE90",
                "#87CEEB",
                "#FFB6C1",
                "#FFA07A",
                "#DDA0DD"
            ];

            let randomColor =
                colors[Math.floor(Math.random() * colors.length)];

            document.body.style.background = randomColor;
        }

        // BOM - Show Browser Info in Alert
        function showBrowserInfo() {
            alert(
                "Browser Info\n\n" +
                "Browser: " + navigator.userAgent +
                "\n\nCurrent URL: " + location.href +
                "\n\nWindow Width: " + window.innerWidth + " px"
            );
        }

        // BOM - Live Clock
        function updateClock() {
            let now = new Date();
            document.getElementById("clock").innerHTML =
                now.toLocaleTimeString();
        }

        setInterval(updateClock, 1000);
        updateClock();
    </script>

</body>
</html>
