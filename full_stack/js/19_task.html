<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOM & BOM Project</title>

<style>
    body{
        font-family: Arial, sans-serif;
        text-align:center;
        padding:30px;
        background:linear-gradient(to right,#74ebd5,#9face6);
    }

    .container{
        background:white;
        width:400px;
        margin:auto;
        padding:20px;
        border-radius:10px;
        box-shadow:0 0 10px gray;
    }

    input{
        padding:10px;
        width:80%;
        margin:10px;
    }

    button{
        padding:10px 15px;
        margin:5px;
        cursor:pointer;
    }

    #output{
        margin-top:15px;
        font-size:18px;
        font-weight:bold;
    }
</style>
</head>
<body>

<div class="container">
    <h2>DOM & BOM Demo</h2>

    <input type="text" id="nameInput" placeholder="Enter your name">

    <br>

    <button onclick="showGreeting()">Show Greeting</button>
    <button onclick="changeColor()">Change Color</button>
    <button onclick="showBrowserInfo()">Browser Info</button>
    <button onclick="openClock()">Open Clock</button>

    <div id="output"></div>
</div>

<script>
    // DOM Manipulation
    function showGreeting() {
        let name = document.getElementById("nameInput").value;

        document.getElementById("output").innerHTML =
            name ? "Welcome, " + name + " 🎉" : "Please enter your name!";
    }

    // DOM Manipulation
    function changeColor() {
        let colors = ["#FFD700","#90EE90","#87CEEB","#FFB6C1","#FFA07A"];
        let randomColor =
            colors[Math.floor(Math.random() * colors.length)];

        document.body.style.backgroundColor = randomColor;
    }

    // BOM
    function showBrowserInfo() {
        alert(
            "Browser: " + navigator.userAgent +
            "\n\nURL: " + location.href +
            "\nWindow Width: " + window.innerWidth + " px"
        );
    }

    // BOM + DOM (Clock in New Page)
    function openClock() {
        let clockWindow = window.open("", "_blank", "width=400,height=250");

        clockWindow.document.write(`
            <html>
            <head>
                <title>Live Clock</title>
                <style>
                    body{
                        font-family:Arial;
                        text-align:center;
                        margin-top:70px;
                        background:#f4f4f4;
                    }
                    #clock{
                        font-size:45px;
                        color:darkblue;
                        font-weight:bold;
                    }
                </style>
            </head>
            <body>
                <h2>Live Digital Clock</h2>
                <div id="clock"></div>

                <script>
                    function updateClock(){
                        document.getElementById('clock').innerHTML =
                        new Date().toLocaleTimeString();
                    }

                    setInterval(updateClock,1000);
                    updateClock();
                <\/script>
            </body>
            </html>
        `);
    }
</script>

</body>
</html>
