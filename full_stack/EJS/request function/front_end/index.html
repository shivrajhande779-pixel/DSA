<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get & post request</title>
</head>
<body>
    <h2>get request</h2>
    <form method="get" action="http://localhost:3000/register">

        <input placeholder="Enter the user name : "  name="user" type="text" />
        <input name="password" type="password" placeholder="Enter the password : " />
        <button>Submit</button>
    </form>

    <hr>
    <h2>post request</h2>
    <form method="post" action="http://localhost:3000/register">
        <input placeholder="Enter the user name : "  name="user" type="text" />
        <input name="password" type="password" placeholder="Enter the password : " />
        <button>Submit</button>
    </form>
</body>
</html>
