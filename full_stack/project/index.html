<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Booking</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<header>
    <div class="logo">agoda</div>
    <ul>
        <li></li>
        <a href="">Hotels</a>
        <a href="">Flights</a>
        <a href="">Packages</a>
        <a href="">Deals</a>
        <a href="">Login</a>
    </ul>
</header>

<section class="hero">
    <div class="overlay">
        <h1>Find Your Perfect Stay</h1>
        <p>Search from thousands of hotels worldwide.</p>

        <div class="search-box">

            <input type="text" placeholder="Destination">

            <input type="date">

            <input type="date">

            <select>
                <option>2 Guests</option>
                <option>1 Guest</option>
                <option>3 Guests</option>
                <option>4 Guests</option>
            </select>

            <button>Search</button>

        </div>
    </div>
</section>

<section class="popular">

    <h2>Popular Destinations</h2>

    <div class="cards">

        <div class="card">
            <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=500" alt="">
            <h3>Bali</h3>
            <p>From $45/night</p>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1493558103817-58b2924bce98?w=500" alt="">
            <h3>Dubai</h3>
            <p>From $75/night</p>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1467269204594-9661b134dd2b?w=500" alt="">
            <h3>Paris</h3>
            <p>From $90/night</p>
        </div>

    </div>

</section>

<footer>
    <p>© 2026 TravelStay. All rights reserved.</p>
</footer>

</body>
</html>
